<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome, Ju - Excel Generator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS untuk Export Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-950 min-h-screen text-slate-100 flex flex-col justify-between p-6">

    <!-- Halaman Onboarding (Tampil Pertama Kali) -->
    <div id="onboardingScreen" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700/80 rounded-3xl p-8 max-w-md w-full text-center shadow-2xl space-y-6">
            <div class="w-16 h-16 bg-indigo-500/10 border border-indigo-500/20 rounded-2xl mx-auto flex items-center justify-center text-3xl shadow-inner">
                ✨
            </div>
            <div class="space-y-2">
                <h2 class="text-2xl font-bold text-white">Welcome, Ju!</h2>
                <p class="text-slate-400 text-sm">Siap mengotomasi pembuatan file Excel dengan gaya yang super cepat dan mudah.</p>
            </div>
            <button onclick="mulaiAplikasi()" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold py-3.5 px-6 rounded-2xl shadow-lg shadow-indigo-600/30 transition duration-200 flex items-center justify-center gap-2 cursor-pointer text-base">
                <span>🥺👉👈</span> Helpkan Yuaaaaan
            </button>
        </div>
    </div>

    <!-- Header / Navbar -->
    <header class="max-w-4xl mx-auto w-full text-center py-6">
        <span class="bg-indigo-500/10 text-indigo-400 text-xs font-semibold px-3 py-1 rounded-full border border-indigo-500/20 uppercase tracking-wider">Welcome, Ju</span>
        <h1 class="text-3xl sm:text-4xl font-bold tracking-tight mt-3 text-white">Excel Template Generator</h1>
        <p class="text-slate-400 text-sm mt-1">Ubah input kata menjadi struktur baris template siap pakai secara instan.</p>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto w-full grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        
        <!-- Panel Kontrol (Kiri) -->
        <div class="bg-slate-800/60 backdrop-blur-xl border border-slate-700/50 rounded-2xl p-6 shadow-xl flex flex-col justify-between space-y-6">
            <div class="space-y-4">
                <h2 class="text-lg font-semibold text-white border-b border-slate-700 pb-3 flex items-center gap-2">
                    <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
                    Konfigurasi
                </h2>

                <!-- Pilih Template -->
                <div>
                    <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-2">Pilih Template</label>
                    <select id="templateChoice" onchange="updatePreview()" class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                        <option value="1">Template 1: 5 Variasi Kode (a11, a12...)</option>
                        <option value="2">Template 2: 4 Tahap Workflow (start, process...)</option>
                    </select>
                </div>

                <!-- Input Kata -->
                <div>
                    <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-2">Kata / Kode Utama</label>
                    <input type="text" id="inputKata" oninput="updatePreview()" placeholder="Contoh: A1" class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                </div>
            </div>

            <!-- Tombol Aksi -->
            <button onclick="downloadExcel()" id="downloadBtn" disabled class="w-full bg-indigo-600/50 text-slate-400 font-medium py-3 rounded-xl transition duration-200 shadow-lg cursor-not-allowed flex items-center justify-center gap-2 text-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 0
